# The tests, on every pull request and every push to main.
#  - test: the whole suite on Linux. Browser mode has no dependencies, so there is nothing to install but ffmpeg;
#    the desktop test skips itself there (no Electron).
#  - desktop: the desktop app's start-up test on Windows, with the real Electron (test/desktop.test.mjs), and the
#    installer built as it is for a release (kept with the run for a week, to try a pull request's build).
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: node --test test/*.test.mjs test/server-*.mjs apps/*/test/*.test.mjs

  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Chocolatey's feed answers 503 now and then, and choco exits 0 all the same: try again, and check for the tool
      - name: Install ffmpeg
        run: |
          foreach ($try in 1..4) {
            choco install ffmpeg --no-progress -y
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { ffmpeg -version | Select-Object -First 1; exit 0 }
            Start-Sleep -Seconds 20
          }
          throw 'ffmpeg could not be installed'
      - run: pnpm install --frozen-lockfile
      # pnpm does not run Electron's install script; this is what fetches its binary
      - name: Download Electron
        run: node apps/desktop/node_modules/electron/install.js
      - run: node --test test/desktop.test.mjs
        env:
          DESKTOP_TEST_REQUIRED: 1
      - name: Build the installer
        run: pnpm dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
