<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="Claudio: five music apps that Claude plays">
  <!-- The README's header. It carries its own dark panel, so it reads the same on a light and on a dark page.
       The name is written as in the desktop app's home window (apps/desktop/home.html); the five marks are the apps'
       icons (apps/desktop/icons.js, at rest), in their order on the home window. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#191922"/>
      <stop offset="1" stop-color="#09090c"/>
    </radialGradient>
  </defs>
  <rect width="960" height="240" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="959" height="239" rx="17.5" fill="none" stroke="#262631"/>

  <!-- the name -->
  <text x="489" y="104" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="64" letter-spacing="18" fill="#ecebf2">CLAUD<tspan fill="#ff7a45">IO</tspan></text>
  <text x="480" y="142" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#a09fb0">Five music apps that Claude plays. You direct.</text>

  <!-- the five apps -->
  <g transform="translate(0 166)">
    <svg x="308" y="0" width="48" height="48" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#111"/><circle cx="16" cy="16" r="9" fill="none" stroke="#ff7a45" stroke-width="2"/><circle cx="16" cy="16" r="2.5" fill="#36d6e7"/></svg>
    <svg x="382" y="0" width="48" height="48" viewBox="0 0 16 16"><g><rect width="16" height="16" rx="3" fill="#09090c"/><rect x="2" y="9" width="3" height="5" fill="#ff7a45"/><rect x="7" y="4" width="3" height="10" fill="#36d6e7"/><rect x="12" y="7" width="3" height="7" fill="#9be564"/></g></svg>
    <svg x="456" y="0" width="48" height="48" viewBox="0 0 16 16"><defs><clipPath id="wave-in"><rect x="2" y="0" width="12" height="16"/></clipPath></defs><rect width="16" height="16" rx="3" fill="#09090c"/><g clip-path="url(#wave-in)"><path d="M2 11 L5 4 L8 11 L11 4 L14 11 L17 4 L20 11" fill="none" stroke="#ff7a45" stroke-width="1.8" stroke-linejoin="round"/></g></svg>
    <svg x="530" y="0" width="48" height="48" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="#09090c"/><rect x="2" y="3" width="8" height="3" rx="1" fill="#ff7a45"/><rect x="6" y="7" width="8" height="3" rx="1" fill="#36d6e7"/><rect x="2" y="11" width="5" height="3" rx="1" fill="#9be564"/></svg>
    <svg x="604" y="0" width="48" height="48" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="#09090c"/><g><path d="M12.7 9.7A5 5 0 1 1 12.1 5.13" fill="none" stroke="#36d6e7" stroke-width="1.6" stroke-linecap="round"/><path d="M13 6.44 13.16 4.38 11.04 5.88Z" fill="#36d6e7"/></g><rect x="7.2" y="5" width="1.6" height="6" rx=".5" fill="#ff7a45"/></svg>
  </g>
</svg>
