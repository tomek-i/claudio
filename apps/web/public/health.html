<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ Claude · Health</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23111'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23ff7a45' stroke-width='2'/><circle cx='16' cy='16' r='2.5' fill='%2336d6e7'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/health.css">
</head>
<body class="health">
<header class="top">
  <div class="brand"><span class="disc"></span>DJ<span class="dot">·</span>CLAUDE</div>
  <div class="status" id="overall"><span class="led"></span><span class="txt">checking…</span></div>
  <span class="spacer"></span>
  <a class="btn sm" href="/settings">Settings</a>
  <a class="btn sm" href="/" data-back>Back to the decks</a>
</header>
<main>
  <h2>System health <small id="checkedAt"></small></h2>
  <ul id="checks" aria-live="polite"></ul>
  <p><button class="btn sm" id="recheck">Check again</button></p>
  <p class="hint">Red: a required system is down and the decks cannot play. Amber: an optional system has a fault; everything else works.</p>
  <p class="hint">Checked once when this page opens; nothing runs in the background. The same data as JSON: <a href="/api/health"><code>/api/health</code></a></p>
</main>
<script type="module" src="ui/back.js"></script>
<script type="module">
import { $, esc } from './ui/util.js';

const LABEL = { ok: 'OK', warn: 'Limited', fail: 'Problem', off: 'Off' };
async function refresh() {
  let h;
  try { h = await fetch('/api/health').then((r) => r.json()); }
  catch { h = { ok: false, checkedAt: Date.now(), checks: [{ id: 'server', name: 'Server', status: 'fail', detail: 'not reachable: start it with node dj.mjs start' }] }; }
  const count = (st) => h.checks.filter((c) => c.status === st).length, n = (k, word) => `${k} ${word}${k === 1 ? '' : 's'}`;
  const bad = count('fail'), limited = count('warn');
  $('#overall').className = `status ${bad ? 'bad' : limited ? 'limited' : 'on'}`;
  $('#overall .txt').textContent = bad ? `${n(bad, 'required system')} down` : limited ? `ready to play · ${n(limited, 'optional system')} limited` : 'all systems go';
  $('#checkedAt').textContent = `checked ${new Date(h.checkedAt).toLocaleTimeString()}`;
  $('#checks').innerHTML = h.checks.map((c) => `<li class="check ${c.status}">
    <span class="dot" role="img" aria-label="${LABEL[c.status]}"></span>
    <span class="name">${esc(c.name)}${c.required === false ? ' <small>optional</small>' : ''}</span>
    <span class="state">${LABEL[c.status]}</span>
    <span class="detail">${esc(c.detail)}</span></li>`).join('');
}
$('#recheck').onclick = refresh;
refresh();
</script>
</body>
</html>
