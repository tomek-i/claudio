<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Claudio</title>
<!-- Claudio's home window (main.mjs): one card per app. A local file with nothing to fetch, and no preload: a card is
     a link to #open/<id>: the page stays where it is, main.mjs sees its address change and opens that app, and it says
     how each app is doing by calling state() below, and how the updates are by calling update(); the footer's link to
     #update checks for one, or restarts into it. -->
<style>
  :root { --bg: #09090c; --card: #111117; --line: #262631; --text: #ecebf2; --dim: #a09fb0; --faint: #7f7e92; --ok: #7ee787; --fail: #ff6b6b; --a: #ff7a45; --b: #36d6e7; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #17171f 0%, var(--bg) 62%); color: var(--text);
    font: 13px/1.4 'Space Grotesk', system-ui, 'Segoe UI', sans-serif; user-select: none;
    display: flex; flex-direction: column; align-items: center; padding: 30px 32px 20px; overflow: auto;
  }
  .brand { font-size: 24px; font-weight: 700; letter-spacing: .32em; padding-left: .32em; }
  .brand i { font-style: normal; color: var(--a); }
  .tag { margin-top: 4px; color: var(--faint); font-size: 12px; letter-spacing: .04em; }

  .apps { margin-top: 26px; width: 100%; max-width: 760px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 560px) { .apps { grid-template-columns: 1fr; } }
  .app {
    position: relative; display: flex; gap: 16px; align-items: center; padding: 18px; min-height: 112px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none;
    transition: border-color .12s, transform .12s, background .12s; outline: none;
  }
  .app:hover, .app:focus-visible { border-color: var(--c); background: #15151c; }
  .app:active { transform: translateY(1px); }
  .app .art { width: 64px; height: 64px; flex: none; position: relative; }
  .app .name { font-size: 16px; font-weight: 600; }
  .app .what { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .app .state { margin-top: 8px; font-size: 11px; color: var(--faint); display: flex; align-items: center; gap: 6px; min-height: 15px; }
  .app .state::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: none; }
  .app[data-state=starting] .state::before { background: none; border: 2px solid var(--line); border-top-color: var(--c); width: 9px; height: 9px; animation: spin .7s linear infinite; }
  .app[data-state=open] .state { color: var(--ok); }
  .app[data-state=open] .state::before { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .app[data-state=failed] .state { color: var(--fail); }
  .app[data-state=failed] .state::before { background: var(--fail); }
  .app kbd { position: absolute; top: 10px; right: 12px; font: 11px ui-monospace, Consolas, monospace; color: var(--faint); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* each app's picture, and how it moves on hover: icons.js */
  .app:last-child:nth-child(odd) { grid-column: 1 / -1; }   /* five cards: the last one across the row */

  .foot { margin-top: auto; padding-top: 22px; color: var(--faint); font-size: 11px; text-align: center; }
  .update { margin-top: 6px; min-height: 15px; }
  .update a { color: var(--dim); margin-left: 6px; text-decoration: underline; text-underline-offset: 2px; }
  .update a:hover, .update a:focus-visible { color: var(--text); outline: none; }
  .update a[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { .app, .app[data-state=starting] .state::before { animation: none; transition: none; } }
</style>
</head>
<body>
<div class="brand">CLAUD<i>IO</i></div>
<div class="tag">five instruments, one Claude</div>
<nav class="apps" id="apps"></nav>
<div class="foot">Each app opens in a window of its own. The Apps menu has them all, from any window.
  <div class="update" id="update"><span></span><a href="#update" hidden></a></div></div>
<script src="icons.js"></script>
<script>
  // filled by main.mjs before the page shows (the list is apps.mjs's); one card per app
  const WORD = { off: 'not running', starting: 'starting…', open: 'open', failed: 'could not start' };
  function setApps(list) {
    const nav = document.getElementById('apps');
    nav.textContent = '';
    list.forEach((a, i) => {
      const el = nav.appendChild(document.createElement('a'));
      el.className = 'app'; el.href = `#open/${a.id}`; el.dataset.id = a.id; el.dataset.state = 'off';
      el.style.setProperty('--c', a.color);
      el.innerHTML = `<div class="art">${ART[a.id] || ''}</div><div><div class="name"></div><div class="what"></div><div class="state"></div></div><kbd>${i + 1}</kbd>`;
      el.querySelector('.name').textContent = a.name;
      el.querySelector('.what').textContent = a.what;
      state(a.id, 'off');
    });
    nav.querySelector('a')?.focus();
  }
  // how an app is doing: off | starting | open | failed, with an optional detail (the error)
  function state(id, st, detail = '') {
    const el = document.querySelector(`.app[data-id="${id}"]`);
    if (!el) return;
    el.dataset.state = st;
    el.querySelector('.state').textContent = detail ? `${WORD[st]}: ${detail}` : WORD[st];
    el.title = detail;
  }
  // what the updates are doing (updates.mjs describe()): a line, and the link for the action, when there is one
  function update({ text, action }) {
    const el = document.getElementById('update'), a = el.querySelector('a');
    el.querySelector('span').textContent = text;
    a.textContent = action || ''; a.hidden = !action;
  }
  // 1-5 open the apps, the arrow keys move between the cards
  addEventListener('keydown', (e) => {
    const cards = [...document.querySelectorAll('.app')];
    if (/^[1-9]$/.test(e.key) && cards[e.key - 1]) return cards[e.key - 1].click();
    const at = cards.indexOf(document.activeElement), step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 2, ArrowUp: -2 }[e.key];
    if (step && cards.length) { e.preventDefault(); cards[(Math.max(at, 0) + step + cards.length) % cards.length].focus(); }
  });
</script>
</body>
</html>
