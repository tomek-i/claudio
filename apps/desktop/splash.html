<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>DJ Claude</title>
<!-- The desktop app's start-up window (main.mjs). It is a local file with nothing to fetch, so it is on screen before
     the server exists. main.mjs reports each start-up step by calling step() / done() / failed() below. -->
<style>
  :root { --bg: #09090c; --line: #262631; --text: #ecebf2; --dim: #a09fb0; --faint: #7f7e92; --a: #ff7a45; --b: #36d6e7; --ok: #7ee787; --warn: #f2cc60; --fail: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #17171f 0%, var(--bg) 62%); color: var(--text);
    font: 13px/1.4 'Space Grotesk', system-ui, 'Segoe UI', sans-serif; border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; padding: 34px 34px 22px; overflow: hidden;
    user-select: none; -webkit-app-region: drag;
  }

  /* the logo: the record of the page's icon, turning */
  .disc { position: relative; width: 108px; height: 108px; border-radius: 50%; flex: none;
    background: repeating-radial-gradient(circle, #111 0 3px, #17171d 3px 4px); box-shadow: 0 0 0 1px #000, 0 10px 26px rgba(0, 0, 0, .6);
    animation: spin 2.4s linear infinite; }
  .disc::before { content: ''; position: absolute; inset: 21px; border-radius: 50%; border: 5px solid var(--a); border-right-color: transparent; }
  .disc::after { content: ''; position: absolute; inset: 45px; border-radius: 50%; background: var(--b); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .brand { margin-top: 20px; font-size: 21px; font-weight: 700; letter-spacing: .26em; padding-left: .26em; }
  .brand i { font-style: normal; color: var(--a); }

  .eq { display: flex; align-items: flex-end; gap: 4px; height: 26px; margin-top: 16px; }
  .eq b { width: 5px; height: 100%; border-radius: 1px; background: linear-gradient(var(--b), var(--a)); transform-origin: bottom; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%, 100% { transform: scaleY(.18); } 50% { transform: scaleY(1); } }

  .steps { list-style: none; margin: 20px 0 0; padding: 0; width: 100%; flex: 1; min-height: 0; overflow: hidden; }
  .steps li { display: flex; align-items: baseline; gap: 9px; padding: 3px 0; animation: in .18s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(3px); } }
  .steps .mark { width: 12px; flex: none; text-align: center; font-size: 11px; color: var(--faint); }
  .steps .name { flex: none; font-weight: 500; }
  .steps .detail { flex: 1; min-width: 0; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; font-size: 12px; }
  .steps li[data-state=run] .mark { width: 9px; height: 9px; margin: 0 1.5px; border: 2px solid var(--line); border-top-color: var(--b); border-radius: 50%; align-self: center; animation: spin .7s linear infinite; }
  .steps li[data-state=ok] .mark { color: var(--ok); }
  .steps li[data-state=warn] .mark, .steps li[data-state=warn] .detail { color: var(--warn); }
  .steps li[data-state=fail] .mark, .steps li[data-state=fail] .detail { color: var(--fail); }
  .steps li[data-state=warn] .detail, .steps li[data-state=fail] .detail { white-space: normal; }

  .foot { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 28px; color: var(--dim); font-size: 12px; }
  .foot #msg { flex: 1; }
  .foot button { display: none; -webkit-app-region: no-drag; font: inherit; color: var(--text); background: #181820; border: 1px solid var(--line); border-radius: 4px; padding: 4px 14px; cursor: pointer; }
  .foot button:hover { border-color: var(--faint); }

  /* nothing is loading any more: started, or stopped on an error */
  body.still .disc, body.still .eq b { animation-play-state: paused; }
  body.failed .foot #msg { color: var(--fail); }
  body.failed .foot button { display: block; }
  @media (prefers-reduced-motion: reduce) { .disc, .eq b, .steps li { animation: none; } .eq b { transform: scaleY(.6); } }
</style>
</head>
<body>
<div class="disc" aria-hidden="true"></div>
<div class="brand">DJ<i>·</i>CLAUDE</div>
<div class="eq" id="eq" aria-hidden="true"></div>
<ul class="steps" id="steps" aria-live="polite"></ul>
<div class="foot"><span id="msg">Starting…</span><button id="close">Close</button></div>
<script>
  const MARK = { run: '', ok: '✓', warn: '!', fail: '✕' };
  const eq = document.getElementById('eq'), steps = document.getElementById('steps'), msg = document.getElementById('msg');
  for (let i = 0; i < 14; i++) {
    const b = eq.appendChild(document.createElement('b'));
    b.style.animationDuration = `${0.7 + ((i * 7) % 5) * 0.13}s`;
    b.style.animationDelay = `${-((i * 3) % 7) * 0.11}s`;
  }
  // one line per start-up step; a second call with the same id updates the line. state: run | ok | warn | fail
  function step(id, name, state, detail = '') {
    let li = steps.querySelector(`[data-id="${id}"]`);
    if (!li) {
      li = steps.appendChild(document.createElement('li'));
      li.dataset.id = id;
      for (const c of ['mark', 'name', 'detail']) li.appendChild(document.createElement('span')).className = c;
    }
    li.dataset.state = state;
    li.children[0].textContent = MARK[state] ?? '';
    li.children[1].textContent = name;
    li.children[2].textContent = detail;
    li.children[2].title = detail;
  }
  function done(text) { document.body.classList.add('still'); msg.textContent = text; }
  function failed(text) { document.body.classList.add('still', 'failed'); msg.textContent = text; }
  document.getElementById('close').onclick = () => window.close();
</script>
</body>
</html>
