<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ Claude · Settings</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23111'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23ff7a45' stroke-width='2'/><circle cx='16' cy='16' r='2.5' fill='%2336d6e7'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/settings.css">
</head>
<body class="settings">
<header class="top">
  <div class="brand"><span class="disc"></span>DJ<span class="dot">·</span>CLAUDE</div>
  <span class="spacer"></span>
  <a class="btn sm" href="/health">Health</a>
  <a class="btn sm" href="/">Back to the decks</a>
</header>
<main>
  <nav class="setnav" aria-label="Settings categories">
    <input type="search" id="find" placeholder="Search settings…" autocomplete="off" aria-label="Search settings">
    <div class="cats" id="cats"></div>
  </nav>
  <div class="setbody">
    <h2><span id="catname">Settings</span> <small>saved to config.json</small></h2>
    <p class="notice restart" id="restart" hidden></p>
    <form id="form" novalidate></form>
    <p class="notice" id="nomatch" hidden>No setting matches that search.</p>
  </div>
  <div class="actions">
    <button class="btn" id="save" form="form" disabled>Save changes</button>
    <button class="btn" id="revert" type="button" disabled>Discard</button>
    <span class="result" id="result" role="status"></span>
  </div>
</main>
<script type="module" src="ui/settings.js"></script>
</body>
</html>
